<!-- EMG motion graphic: Public Relations · "Earned media, filled in"
     Drop-in replacement for public-relations-graphic.webp inside .media-content__media.
     Needs emg-motion.css (and optionally emg-motion.js). -->
<div class="emg-mg emg-earned" role="img" aria-label="Paid and organic channels are flowing, earned media fills in, and your story spreads into press, podcasts, influencer posts, and search visibility">
	<svg viewBox="0 0 790 470" aria-hidden="true" focusable="false">
		<defs>
			<linearGradient id="emge-ring" x1="0" y1="0" x2="1" y2="1">
				<stop offset="0%" class="stop-pink"/>
				<stop offset="50%" class="stop-blue"/>
				<stop offset="100%" class="stop-teal"/>
			</linearGradient>
			<radialGradient id="emge-core" cx="40%" cy="35%" r="75%">
				<stop offset="0%" stop-color="#15508a"/>
				<stop offset="100%" stop-color="#062c55"/>
			</radialGradient>
			<filter id="emge-glow" x="-200%" y="-200%" width="500%" height="500%">
				<feGaussianBlur stdDeviation="4" result="b"/>
				<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
			</filter>
			<filter id="emge-halo" x="-60%" y="-60%" width="220%" height="220%">
				<feGaussianBlur stdDeviation="14"/>
			</filter>
			<filter id="emge-shadow" x="-30%" y="-50%" width="160%" height="220%">
				<feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#073c72" flood-opacity=".15"/>
			</filter>
			<path id="emge-r-paid" d="M56 104 H270 C340 104 360 196 412 210"/>
			<path id="emge-r-org" d="M56 235 H408"/>
			<path id="emge-r-earn" d="M56 366 H270 C340 366 360 274 412 260"/>
		</defs>

		<!-- Paid + organic ribbons (always flowing) -->
		<path class="emge-ribbon s-pink" d="M56 104 H270 C340 104 360 196 412 210"/>
		<path class="emge-ribbon s-blue" d="M56 235 H408"/>
		<path class="emge-flow" d="M56 104 H270 C340 104 360 196 412 210"/>
		<path class="emge-flow" d="M56 235 H408"/>
		<text x="98" y="110" class="emg-label emg-label--lg" fill="#fff">PAID</text>
		<text x="98" y="241" class="emg-label emg-label--lg" fill="#fff">ORGANIC</text>

		<g class="emg-packet" filter="url(#emge-glow)">
			<circle r="5" fill="#fff"/>
			<animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#emge-r-paid"/></animateMotion>
		</g>
		<g class="emg-packet" filter="url(#emge-glow)">
			<circle r="5" fill="#fff"/>
			<animateMotion dur="2.6s" begin=".9s" repeatCount="indefinite"><mpath href="#emge-r-org"/></animateMotion>
		</g>

		<!-- Earned: ghost state (missing) -->
		<path class="emge-ribbon emge-ghost" d="M56 366 H270 C340 366 360 274 412 260"/>
		<path class="emge-ghost-edge" d="M56 366 H270 C340 366 360 274 412 260"/>
		<text x="98" y="372" class="emg-label emg-label--lg emge-ghost-text">EARNED</text>

		<!-- Badges -->
		<circle cx="56" cy="104" r="27" fill="#fff" stroke-width="5" class="s-pink"/>
		<text x="56" y="112" class="emge-dollar f-pink" text-anchor="middle">$</text>

		<circle cx="56" cy="235" r="27" fill="#fff" stroke-width="5" class="s-blue"/>
		<path d="M44 246 C44 228 56 222 69 222 C69 238 60 246 44 246 Z M44 246 L58 232" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="s-blue"/>

		<circle cx="56" cy="366" r="27" fill="#fff" class="emge-ghost-badge"/>
		<path d="M56 351 l4.4 9 9.9 1.4-7.2 7 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.2-7 9.9-1.4z" fill="none" stroke-width="2.5" stroke-linejoin="round" class="emge-ghost-star"/>

		<!-- Hub: dim base -->
		<circle cx="480" cy="235" r="100" class="emge-orbit-dots"/>
		<circle cx="480" cy="235" r="74" fill="none" stroke-width="14" class="emge-ring-base"/>
		<circle cx="480" cy="235" r="62" fill="url(#emge-core)"/>

		<!-- Built layer -->
		<g class="emge-built">
			<!-- Earned fills in -->
			<path class="emge-ribbon s-teal emge-earn-fill" pathLength="100" d="M56 366 H270 C340 366 360 274 412 260"/>
			<path class="emge-flow emge-earn-flow" d="M56 366 H270 C340 366 360 274 412 260"/>
			<text x="98" y="372" class="emg-label emg-label--lg emge-earn-text" fill="#fff">EARNED</text>
			<g class="emg-packet emge-earn-flow" filter="url(#emge-glow)">
				<circle r="5" fill="#fff"/>
				<animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite"><mpath href="#emge-r-earn"/></animateMotion>
			</g>
			<g class="emge-badge">
				<circle cx="56" cy="366" r="27" fill="#fff" stroke-width="5" class="s-teal"/>
				<path d="M56 351 l4.4 9 9.9 1.4-7.2 7 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.2-7 9.9-1.4z" class="f-teal"/>
			</g>
			<g class="emge-spark" stroke-width="3" stroke-linecap="round">
				<line x1="56" y1="326" x2="56" y2="316" class="s-teal"/>
				<line x1="88" y1="340" x2="96" y2="334" class="s-pink"/>
				<line x1="24" y1="340" x2="16" y2="334" class="s-pink"/>
				<line x1="92" y1="372" x2="102" y2="374" class="s-teal"/>
				<line x1="20" y1="372" x2="10" y2="374" class="s-teal"/>
			</g>

			<!-- Hub lights up -->
			<circle cx="480" cy="235" r="80" class="emge-hub-halo f-teal" filter="url(#emge-halo)"/>
			<circle cx="480" cy="235" r="74" fill="none" stroke="url(#emge-ring)" stroke-width="14" stroke-linecap="round" pathLength="100" class="emge-ring-lit" transform="rotate(-90 480 235)"/>
			<g class="emge-ripples">
				<circle cx="480" cy="235" r="74" class="emge-ripple s-teal"/>
				<circle cx="480" cy="235" r="74" class="emge-ripple emge-ripple--2 s-pink"/>
				<circle cx="480" cy="235" r="74" class="emge-ripple emge-ripple--3 s-teal"/>
			</g>

			<!-- Coverage cards -->
			<line x1="522" y1="174" x2="596" y2="65" pathLength="100" class="emge-link emge-t-1"/>
			<line x1="546" y1="201" x2="596" y2="175" pathLength="100" class="emge-link emge-t-2"/>
			<line x1="548" y1="264" x2="596" y2="285" pathLength="100" class="emge-link emge-t-3"/>
			<line x1="524" y1="295" x2="596" y2="395" pathLength="100" class="emge-link emge-t-4"/>

			<g class="emge-card emge-t-1">
				<rect x="596" y="38" width="184" height="54" rx="12" fill="#fff" filter="url(#emge-shadow)"/>
				<circle cx="619" cy="65" r="13" class="f-pink"/>
				<g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
					<rect x="613" y="59" width="12" height="12" rx="1.5"/>
					<line x1="616" y1="63" x2="622" y2="63"/><line x1="616" y1="67" x2="620" y2="67"/>
				</g>
				<text x="640" y="62" class="emg-label emg-label--sm f-navy">PRESS FEATURE</text>
				<rect x="640" y="70" width="96" height="4" rx="2" class="emge-bar"/>
			</g>
			<g class="emge-card emge-t-2">
				<rect x="596" y="148" width="184" height="54" rx="12" fill="#fff" filter="url(#emge-shadow)"/>
				<circle cx="619" cy="175" r="13" class="f-blue"/>
				<g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
					<rect x="616" y="167" width="6" height="10" rx="3"/>
					<path d="M613.5 174a5.5 5.5 0 0 0 11 0M619 179.5v3.5"/>
				</g>
				<text x="640" y="172" class="emg-label emg-label--sm f-navy">PODCAST GUEST</text>
				<rect x="640" y="180" width="84" height="4" rx="2" class="emge-bar"/>
			</g>
			<g class="emge-card emge-t-3">
				<rect x="596" y="258" width="184" height="54" rx="12" fill="#fff" filter="url(#emge-shadow)"/>
				<circle cx="619" cy="285" r="13" class="f-pink"/>
				<path d="M619 291.5s-6.5-3.9-6.5-8.2a3.4 3.4 0 0 1 6.5-1.5 3.4 3.4 0 0 1 6.5 1.5c0 4.3-6.5 8.2-6.5 8.2z" fill="#fff"/>
				<text x="640" y="282" class="emg-label emg-label--sm f-navy">INFLUENCER POST</text>
				<rect x="640" y="290" width="104" height="4" rx="2" class="emge-bar"/>
			</g>
			<g class="emge-card emge-t-4">
				<rect x="596" y="368" width="184" height="54" rx="12" fill="#fff" filter="url(#emge-shadow)"/>
				<circle cx="619" cy="395" r="13" class="f-teal"/>
				<g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
					<circle cx="617.5" cy="393.5" r="4.5"/><line x1="621" y1="397" x2="625" y2="401"/>
				</g>
				<text x="640" y="391" class="emg-label emg-label--sm f-navy">SEARCH VISIBILITY</text>
				<path d="M641 413 L661 409 L677 410 L697 404 L717 405 L739 397" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="s-teal emge-trend"/>
				<path d="M732 396 L739 397 L737 404" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="s-teal emge-trend-tip"/>
			</g>
		</g>

		<!-- Hub label (always on top) -->
		<text x="480" y="228" class="emg-label emg-label--sm emge-hub-small" text-anchor="middle">YOUR</text>
		<text x="480" y="252" class="emg-label emg-label--xl" fill="#fff" text-anchor="middle">STORY</text>
	</svg>
</div>
