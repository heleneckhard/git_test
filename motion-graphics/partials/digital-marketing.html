<!-- EMG motion graphic: Digital Marketing · "Follow one customer"
     One person moves through paid, organic, and lifecycle, showing the
     channels handing off to each other.
     Drop-in replacement for marketing-circle@2x-1.webp inside .media-content__media. -->
<div class="emg-mg emg-loop" role="img" aria-label="One customer moves from your paid ads, to finding you in search, to booking a call through lifecycle marketing, and back around">
	<svg viewBox="78 46 444 404" aria-hidden="true" focusable="false">
		<defs>
			<filter id="emgl-shadow" x="-30%" y="-30%" width="160%" height="170%">
				<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#073c72" flood-opacity=".13"/>
			</filter>
			<filter id="emgl-glow" x="-200%" y="-200%" width="500%" height="500%">
				<feGaussianBlur stdDeviation="5" result="b"/>
				<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
			</filter>
			<!-- Full loop, starting at Paid (top) and running clockwise -->
			<path id="emgl-route" d="M300 135 A150 150 0 0 1 429.9 360 A150 150 0 0 1 170.1 360 A150 150 0 0 1 300 135"/>
		</defs>

		<!-- Track -->
		<path class="track-arc s-pink" d="M300 135 A150 150 0 0 1 429.9 360"/>
		<path class="track-arc s-teal" d="M429.9 360 A150 150 0 0 1 170.1 360"/>
		<path class="track-arc s-navy" d="M170.1 360 A150 150 0 0 1 300 135"/>

		<!-- The customer (travels behind the cards, which light up as they arrive) -->
		<g class="emg-packet">
			<circle r="15" class="f-navy" filter="url(#emgl-glow)"/>
			<circle r="15" fill="none" stroke="#fff" stroke-width="2.5"/>
			<circle cy="-3.5" r="4.5" fill="#fff"/>
			<path d="M-8 8a8 8 0 0 1 16 0z" fill="#fff"/>
			<animateMotion dur="9s" repeatCount="indefinite" calcMode="spline"
				keyTimes="0;.2;.33;.53;.66;.86;1" keyPoints="0;0;.3333;.3333;.6667;.6667;1"
				keySplines="0 0 1 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1"><mpath href="#emgl-route"/></animateMotion>
		</g>

		<!-- Cards are drawn at their original spots and shifted in to sit on the tighter loop -->
		<!-- ===== Paid (top) ===== -->
		<g transform="translate(0 35)">
		<text x="300" y="34" class="lbl f-pink" text-anchor="middle">PAID</text>
		<rect x="225" y="46" width="150" height="104" rx="14" fill="#fff" filter="url(#emgl-shadow)"/>
		<rect x="225" y="46" width="150" height="104" rx="14" class="card-ring s-pink a emgl-on-1"/>
		<circle cx="245" cy="64" r="6" class="f-navy" opacity=".85"/>
		<rect x="256" y="61" width="40" height="5" rx="2.5" class="ink"/>
		<text x="362" y="66" class="lbl-xxs muted" text-anchor="end">AD</text>
		<rect x="237" y="76" width="126" height="44" rx="8" class="ad-img"/>
		<circle cx="286" cy="98" r="14" class="f-teal" opacity=".85"/>
		<circle cx="310" cy="106" r="8" class="f-blue" opacity=".8"/>
		<rect x="237" y="126" width="126" height="16" rx="8" class="f-pink"/>
		<text x="300" y="137" class="lbl-xxs" fill="#fff" text-anchor="middle">LEARN MORE</text>
		<circle cx="330" cy="134" r="9" fill="none" stroke="#fff" stroke-width="2.5" class="a emgl-tap"/>

		</g>

		<!-- ===== Organic (bottom right) ===== -->
		<g transform="translate(-30.3 -17.5)">
		<text x="460" y="312" class="lbl f-teal-deep" text-anchor="middle">ORGANIC</text>
		<rect x="385" y="325" width="150" height="104" rx="14" fill="#fff" filter="url(#emgl-shadow)"/>
		<rect x="385" y="325" width="150" height="104" rx="14" class="card-ring s-teal a emgl-on-2"/>
		<rect x="397" y="337" width="126" height="20" rx="10" fill="#fff" class="hair-s"/>
		<circle cx="410" cy="346" r="4" fill="none" stroke-width="1.8" class="s-navy"/>
		<line x1="413" y1="349" x2="416" y2="352" stroke-width="1.8" stroke-linecap="round" class="s-navy"/>
		<text x="422" y="350.5" class="search-text">your brand</text>
		<rect x="421" y="340" width="62" height="14" fill="#fff" class="a emgl-typemask"/>
		<rect x="397" y="364" width="126" height="20" rx="6" class="f-teal a emgl-hit"/>
		<rect x="405" y="369" width="70" height="4" rx="2" class="f-blue"/>
		<rect x="405" y="376" width="96" height="3" rx="1.5" class="ink"/>
		<g class="a pop emgl-rank">
			<circle cx="511" cy="374" r="9" class="f-teal"/>
			<text x="511" y="377.3" class="lbl-xxs" fill="#fff" text-anchor="middle">#1</text>
		</g>
		<rect x="405" y="392" width="60" height="4" rx="2" class="ink"/>
		<rect x="405" y="399" width="88" height="3" rx="1.5" class="ink" opacity=".6"/>
		<rect x="405" y="410" width="54" height="4" rx="2" class="ink"/>
		<rect x="405" y="417" width="80" height="3" rx="1.5" class="ink" opacity=".6"/>

		</g>

		<!-- ===== Lifecycle (bottom left) ===== -->
		<g transform="translate(30.3 -17.5)">
		<text x="140" y="312" class="lbl f-navy" text-anchor="middle">LIFECYCLE</text>
		<rect x="65" y="325" width="150" height="104" rx="14" fill="#fff" filter="url(#emgl-shadow)"/>
		<rect x="65" y="325" width="150" height="104" rx="14" class="card-ring s-navy a emgl-on-3"/>
		<rect x="79" y="339" width="30" height="22" rx="4" fill="none" stroke-width="2" class="s-navy"/>
		<path d="M79 341 l15 11 15-11" fill="none" stroke-width="2" stroke-linejoin="round" class="s-navy"/>
		<rect x="118" y="341" width="70" height="5" rx="2.5" class="f-navy" opacity=".7"/>
		<rect x="118" y="352" width="50" height="4" rx="2" class="ink"/>
		<rect x="79" y="370" width="122" height="4" rx="2" class="ink"/>
		<rect x="79" y="379" width="100" height="4" rx="2" class="ink"/>
		<rect x="79" y="394" width="72" height="18" rx="9" class="f-pink"/>
		<text x="115" y="406" class="lbl-xxs" fill="#fff" text-anchor="middle">BOOK A CALL</text>
		<g class="a emgl-order">
			<rect x="77" y="391" width="126" height="24" rx="12" fill="#fff" class="s-teal" stroke-width="2"/>
			<circle cx="92" cy="403" r="7" class="f-teal"/>
			<path d="M88.8 403.2l2.2 2.2 4-4.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
			<text x="104" y="406.5" class="lbl-xxs f-navy">CALL BOOKED</text>
		</g>
		</g>
	</svg>
</div>
