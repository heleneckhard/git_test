<!-- EMG motion graphic: Digital Marketing · "One continuous growth loop"
     Drop-in replacement for marketing-circle@2x-1.webp inside .media-content__media.
     Needs emg-motion.css (and optionally emg-motion.js). -->
<div class="emg-mg emg-loop" role="img" aria-label="Paid advertising, organic marketing, and lifecycle marketing working as one continuous growth loop">
	<svg viewBox="0 8 600 490" aria-hidden="true" focusable="false">
		<defs>
			<radialGradient id="emgl-disc" cx="50%" cy="45%" r="60%">
				<stop offset="0%" class="stop-pink" stop-opacity=".10"/>
				<stop offset="70%" class="stop-pink" stop-opacity=".05"/>
				<stop offset="100%" class="stop-pink" stop-opacity="0"/>
			</radialGradient>
			<linearGradient id="emgl-trail" x1="0" y1="0" x2="1" y2="0">
				<stop offset="0%" class="stop-teal" stop-opacity="0"/>
				<stop offset="100%" class="stop-pink" stop-opacity="1"/>
			</linearGradient>
			<filter id="emgl-glow" x="-200%" y="-200%" width="500%" height="500%">
				<feGaussianBlur stdDeviation="5" result="b"/>
				<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
			</filter>
			<filter id="emgl-shadow" x="-40%" y="-40%" width="180%" height="180%">
				<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#073c72" flood-opacity=".13"/>
			</filter>
			<path id="emgl-arc-top" d="M-75.3 -20.2 A78 78 0 0 1 75.3 -20.2"/>
			<path id="emgl-arc-bot" d="M-69.3 40 A80 80 0 0 0 69.3 40"/>
		</defs>

		<!-- Center -->
		<circle cx="300" cy="300" r="128" fill="url(#emgl-disc)"/>
		<text x="300" y="242" class="emg-label emg-label--sm emgl-muted" text-anchor="middle">ONE CONTINUOUS</text>
		<text x="300" y="268" class="emg-label emg-label--xl f-navy" text-anchor="middle">GROWTH LOOP</text>
		<line x1="236" y1="364" x2="366" y2="364" class="emgl-axis"/>
		<path class="emgl-chart" pathLength="100" d="M236 354 C252 352 260 342 274 340 S296 332 306 322 S330 314 340 306 S356 294 366 286"/>
		<g class="emgl-chart-dots">
			<circle cx="274" cy="340" r="4.5" class="f-pink emgl-cdot emgl-cdot--1"/>
			<circle cx="306" cy="322" r="4.5" class="f-teal emgl-cdot emgl-cdot--2"/>
			<circle cx="340" cy="306" r="4.5" class="f-navy emgl-cdot emgl-cdot--3"/>
			<path d="M358 284 L368 284 L368 294" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="s-pink emgl-cdot emgl-cdot--4"/>
		</g>

		<!-- Loop track: three colored thirds -->
		<path class="emgl-track s-pink" d="M300 110 A190 190 0 0 1 464.5 395"/>
		<path class="emgl-track s-teal" d="M464.5 395 A190 190 0 0 1 135.5 395"/>
		<path class="emgl-track s-navy" d="M135.5 395 A190 190 0 0 1 300 110"/>

		<!-- Direction chevrons -->
		<path class="emgl-chev s-pink" d="M-5 -7 L4 0 L-5 7" transform="translate(464.5 205) rotate(60)"/>
		<path class="emgl-chev s-teal" d="M-5 -7 L4 0 L-5 7" transform="translate(300 490) rotate(180)"/>
		<path class="emgl-chev s-navy" d="M-5 -7 L4 0 L-5 7" transform="translate(135.5 205) rotate(300)"/>

		<!-- Orbiting comet + trail -->
		<g class="emgl-orbit">
			<circle cx="300" cy="300" r="190" class="emgl-trail" pathLength="100" transform="rotate(-90 300 300)"/>
			<circle cx="300" cy="110" r="8" class="f-pink" filter="url(#emgl-glow)"/>
			<circle cx="300" cy="110" r="3.5" fill="#fff"/>
		</g>

		<!-- Node: Paid Advertising (top) -->
		<g transform="translate(300 110)">
			<circle r="58" class="emgl-halo s-pink emgl-t-1"/>
			<g class="emgl-node emgl-t-1">
				<circle r="58" fill="#fff" filter="url(#emgl-shadow)"/>
				<circle r="58" fill="none" stroke-width="7" class="s-pink"/>
				<g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="s-pink">
					<path d="M-26 -6 L-2 -18 V14 L-26 4 Z"/>
					<path d="M-20 5 L-16 18 H-9 L-12 7"/>
					<path class="emgl-wave emgl-wave--1" d="M6 -9 Q12 -1 6 7"/>
					<path class="emgl-wave emgl-wave--2" d="M12 -15 Q22 -1 12 13"/>
				</g>
				<g class="emgl-coin">
					<circle cx="20" cy="-24" r="10" class="f-pink"/>
					<text x="20" y="-19.5" class="emg-label emg-label--sm" fill="#fff" text-anchor="middle">$</text>
				</g>
			</g>
			<text class="emg-label emg-label--md f-pink" text-anchor="middle"><textPath href="#emgl-arc-top" startOffset="50%">PAID ADVERTISING</textPath></text>
		</g>

		<!-- Node: Organic Marketing (bottom right) -->
		<g transform="translate(464.5 395)">
			<circle r="58" class="emgl-halo s-teal emgl-t-2"/>
			<g class="emgl-node emgl-t-2">
				<circle r="58" fill="#fff" filter="url(#emgl-shadow)"/>
				<circle r="58" fill="none" stroke-width="7" class="s-teal"/>
				<rect x="-27" y="-22" width="54" height="42" rx="6" fill="none" stroke-width="3" class="s-teal"/>
				<line x1="-27" y1="-13" x2="27" y2="-13" stroke-width="3" class="s-teal"/>
				<rect x="-17" y="4" width="7" height="10" rx="1.5" class="f-teal emgl-bar emgl-bar--1"/>
				<rect x="-6" y="-2" width="7" height="16" rx="1.5" class="f-teal emgl-bar emgl-bar--2"/>
				<rect x="5" y="-6" width="7" height="20" rx="1.5" class="f-teal emgl-bar emgl-bar--3"/>
				<g class="emgl-sprout">
					<path d="M18 14 V-2" fill="none" stroke-width="2.6" stroke-linecap="round" class="s-navy"/>
					<path d="M18 2 C18 -6 24 -8 26 -8 C26 -2 22 2 18 2 Z" class="f-navy"/>
				</g>
			</g>
			<text class="emg-label emg-label--md f-teal-deep" text-anchor="middle"><textPath href="#emgl-arc-top" startOffset="50%">ORGANIC MARKETING</textPath></text>
		</g>

		<!-- Node: Lifecycle Marketing (bottom left) -->
		<g transform="translate(135.5 395)">
			<circle r="58" class="emgl-halo s-navy emgl-t-3"/>
			<g class="emgl-node emgl-t-3">
				<circle r="58" fill="#fff" filter="url(#emgl-shadow)"/>
				<circle r="58" fill="none" stroke-width="7" class="s-navy"/>
				<circle cx="-9" cy="-30" r="4" class="f-pink emgl-drop emgl-drop--1"/>
				<circle cx="3" cy="-34" r="4" class="f-teal emgl-drop emgl-drop--2"/>
				<circle cx="12" cy="-28" r="4" class="f-blue emgl-drop emgl-drop--3"/>
				<path d="M-24 -16 H24 L6 4 V14 L-6 20 V4 Z" fill="none" stroke-width="3" stroke-linejoin="round" class="s-navy"/>
				<g class="emgl-out">
					<circle cx="0" cy="34" r="8" class="f-pink"/>
					<path d="M-3.5 34 l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				</g>
			</g>
			<text class="emg-label emg-label--md f-navy" text-anchor="middle"><textPath href="#emgl-arc-top" startOffset="50%">LIFECYCLE MARKETING</textPath></text>
		</g>

		<!-- Sub-captions -->
		<g class="emgl-caption">
			<text transform="translate(300 110)" class="emg-label emg-label--xs f-pink" text-anchor="middle"><textPath href="#emgl-arc-bot" startOffset="50%">CAPTURE DEMAND</textPath></text>
			<text transform="translate(464.5 395)" class="emg-label emg-label--xs f-teal-deep" text-anchor="middle"><textPath href="#emgl-arc-bot" startOffset="50%">BUILD YOUR PRESENCE</textPath></text>
			<text transform="translate(135.5 395)" class="emg-label emg-label--xs f-navy" text-anchor="middle"><textPath href="#emgl-arc-bot" startOffset="50%">CONVERT &amp; RETAIN</textPath></text>
		</g>
	</svg>
</div>
