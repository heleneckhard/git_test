<!-- EMG "Two Sides, One Strategy": the two service lists split by a divider,
     with two rings (one per side) that slide together and overlap in the middle.
     Replaces .compare-text__wrapper on /franchise-marketing/ (keep the heading and CTA).
     Needs emg-integrated.css and emg-integrated.js. Without JS the rings simply show overlapped. -->
<div class="emgi">
	<div class="emgi-col emgi-col--left" data-side="left">
		<h4 class="emgi-title">Franchise Development</h4>
		<ul class="emgi-list">
			<li>Dedicated Websites</li>
			<li>Candidate Lead Generation</li>
			<li>Franchise PR and Earned Media</li>
			<li>Candidate Nurture and CRM</li>
		</ul>
	</div>

	<div class="emgi-mid" aria-hidden="true">
		<svg class="emgi-venn" viewBox="0 0 120 80" focusable="false">
			<defs>
				<clipPath id="emgi-clip-left"><circle cx="46" cy="40" r="28"/></clipPath>
			</defs>
			<g class="emgi-lens"><circle cx="74" cy="40" r="28" clip-path="url(#emgi-clip-left)"/></g>
			<circle class="emgi-ring emgi-ring--left" cx="46" cy="40" r="28"/>
			<circle class="emgi-ring emgi-ring--right" cx="74" cy="40" r="28"/>
		</svg>
	</div>

	<div class="emgi-col emgi-col--right" data-side="right">
		<h4 class="emgi-title">Consumer Marketing</h4>
		<ul class="emgi-list">
			<li>Multi-Location SEO and GEO</li>
			<li>National Brand Campaigns</li>
			<li>Local Store Marketing</li>
			<li>Listing and Reputation Management</li>
		</ul>
	</div>
</div>
